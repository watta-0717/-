<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンパス診断</title>
<style>
  body { margin: 0; padding: 20px 16px 40px; background: #15110d; color: #f3ece0; font: 15px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #cfc6b8; }
  button { display: block; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #c0392b; color: #fff; font-size: 17px; font-weight: 700; margin: 10px 0 18px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 4px; border-bottom: 1px solid #3a3128; vertical-align: top; }
  td:first-child { color: #cfc6b8; width: 46%; }
  b.ok { color: #7bd88f; } b.ng { color: #ff7b6b; }
  .big { font-size: 40px; font-weight: 800; text-align: center; color: #e0b44c; margin: 8px 0; }
</style>
</head>
<body>
<h1>コンパス診断</h1>
<p>下のボタンを押し、許可画面が出たら「許可」を選んでください。その後スマホをゆっくり回し、数字が変わるか確かめてください。この画面をスクリーンショットで送ってください。</p>
<button id="go">コンパスの許可を求める</button>
<div class="big" id="deg">—</div>
<table id="t"></table>
<script>
  const rows = {};
  const set = (k, v, cls) => {
    if (!rows[k]) { const tr = document.createElement('tr'); tr.innerHTML = `<td>${k}</td><td></td>`; document.getElementById('t').appendChild(tr); rows[k] = tr.lastChild; }
    rows[k].innerHTML = cls ? `<b class="${cls}">${v}</b>` : v;
  };
  const D = window.DeviceOrientationEvent;
  set('HTTPSで開いているか', window.isSecureContext ? 'はい' : 'いいえ', window.isSecureContext ? 'ok' : 'ng');
  set('方位センサーの機能', D ? 'あり' : 'なし', D ? 'ok' : 'ng');
  set('許可を求める仕組み（iPhone）', D && typeof D.requestPermission === 'function' ? 'あり' : 'なし');
  set('許可の結果', '未実行');
  set('受信回数（deviceorientation）', 0);
  set('受信回数（absolute）', 0);
  set('webkitCompassHeading', '—');
  set('精度（webkitCompassAccuracy）', '—');
  set('alpha / beta / gamma', '—');
  set('ブラウザ', navigator.userAgent);
  let n1 = 0, n2 = 0;
  window.addEventListener('deviceorientation', (e) => {
    n1++; set('受信回数（deviceorientation）', n1, 'ok');
    if (e.webkitCompassHeading != null) { set('webkitCompassHeading', e.webkitCompassHeading.toFixed(1) + '°', 'ok'); document.getElementById('deg').textContent = Math.round(e.webkitCompassHeading) + '°'; }
    if (e.webkitCompassAccuracy != null) set('精度（webkitCompassAccuracy）', '±' + Math.round(e.webkitCompassAccuracy) + '°');
    set('alpha / beta / gamma', [e.alpha, e.beta, e.gamma].map((v) => (v == null ? 'null' : v.toFixed(0))).join(' / ') + (e.absolute ? '（absolute）' : ''));
  });
  window.addEventListener('deviceorientationabsolute', (e) => {
    n2++; set('受信回数（absolute）', n2, 'ok');
    if (e.alpha != null) document.getElementById('deg').textContent = Math.round((360 - e.alpha) % 360) + '°';
  });
  document.getElementById('go').onclick = () => {
    if (!D || typeof D.requestPermission !== 'function') { set('許可の結果', '許可は不要な端末です（Android など）', 'ok'); return; }
    let r;
    try { r = D.requestPermission(); } catch (err) { set('許可の結果', 'エラー: ' + err.name + ' ' + err.message, 'ng'); return; }
    r.then((v) => set('許可の結果', v === 'granted' ? 'granted（許可）' : v + '（拒否）', v === 'granted' ? 'ok' : 'ng'),
           (err) => set('許可の結果', 'エラー: ' + err.name + ' ' + err.message, 'ng'));
  };
</script>
</body>
</html>
